name: update-data

on:
  schedule:
    - cron: '30 13 * * 1-5'        # US open (13:30 UTC)
    - cron: '0,30 14-20 * * 1-5'   # every 30 min during US market hours (14:00-20:30 UTC)
    - cron: '0 5 * * 1-5'            # early morning (08:00 Israel summer time)
    - cron: '20 21 * * 1-5'         # after the close (also covers US winter time)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['config.json', 'scripts/update.py']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch data and score
        run: python scripts/update.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
            done
            exit 1
