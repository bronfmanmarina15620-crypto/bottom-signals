name: update-data

on:
  # GitHub often delays/drops scheduled runs (esp. at :00/:30). So: odd minutes, several
  # redundant triggers, and during US hours a single run LOOPS, refreshing every ~30 min.
  schedule:
    - cron: '7 13 * * 1-5'               # before US open -> starts the market-hours loop
    - cron: '17,47 14-20 * * 1-5'        # backups (if a loop is already running they just queue/cancel)
    - cron: '23 21 * * 1-5'              # after the close (also covers US winter time)
    - cron: '11 5 * * 1-5'               # early morning (08:11 Israel)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['config.json', 'scripts/update.py', '.github/workflows/update-data.yml']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch, score, commit (loops every ~30 min during US market hours)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          start=$(date +%s)
          while true; do
            python scripts/update.py || echo "update.py failed"
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3; do
                git pull --rebase --autostash origin main && git push origin HEAD:main && break
                sleep $((i * 5))
              done
            fi
            hm=$((10#$(date -u +%H%M)))
            el=$(( $(date +%s) - start ))
            # keep looping only between 13:00 and 21:10 UTC, and under ~5h20m per job
            if [ $hm -lt 1300 ] || [ $hm -ge 2110 ] || [ $el -gt 19200 ]; then break; fi
            sleep 1800
          done
